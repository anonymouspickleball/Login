
<!DOCTYPE html>
<html>

<head>
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>My Login Page</title>

    <style>

        h1 {
          color: white
        }

        body {
            color: white;
            background-color: #0f0f0f;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
        }

        .login-box {
            background-color: rgb(1, 1, 70);
            padding: 35px;
            border-radius: 40px;
            width: 300px;
            text-align: center;
            box-sizing: border-box;
        }

        input {
            color: black;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 10px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            border: none;
        }

        a {
            color: white
        }
    </style>

</head>

<body>

    <div class="log in-box">

        <h1>Login</h1>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <br><br>

        <button><a href="https://pornhub.com">Login</a></button>

        <br><br>

        <a href="https://pornhub.com">Don't have an account yet?<br>Sign up!</a>

</body>
</html>
